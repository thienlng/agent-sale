# NEW-1: a fresh chat whose only message is the hold button text has nothing to confirm (no
# summary waits, confirm_hold is not offered): the bot says so and asks what to hold, no handoff.
conversation:
  - customer: '✅ Giữ chỗ'
expect:
  outcome: answered
  guardrail: none
  steps_exclude: ['handoff', 'prepare_hold']
  contains_any: ['chưa có', 'căn nào', 'ngày nào', 'giữ căn', 'muốn giữ']
fake_turns:
  - text: 'Dạ hiện chưa có yêu cầu giữ chỗ nào để xác nhận ạ. Anh/chị muốn giữ căn nào, ngày nào ạ?'
