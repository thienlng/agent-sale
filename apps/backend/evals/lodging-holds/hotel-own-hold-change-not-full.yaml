lodging:
  holds_before:
    - {
        hold: BK-0028,
        code: EVANI,
        checkIn: '2027-12-08',
        checkOut: '2027-12-09',
        adults: 22,
        guestPhone: '0904567891',
        totalSell: 12000000,
      }
# VL3-1: the guest's own hold does not make EVANI look full when they change the party: the
# change is prepared as a replacement hold, never "đã kín".
conversation:
  - customer: 'giữ EVANI đêm 8/12/2027 cho 22 người lớn, Trịnh Quốc Bảo 0904567891'
  - bot: 'Dạ em đã giữ chỗ BK-0028 đến 03:49 ngày 13/11 ạ. Nhân viên sẽ gọi xác nhận sớm ạ.'
  - customer: 'sếp bảo thêm 4 người, sửa lại EVANI thành 26 người lớn giúp mình'
expect:
  guardrail: none
  outcome_not: handoff
  # PO decision DEC-7: prepare_hold checks the calendar itself; a separate check is not required.
  steps_succeeded: ['prepare_hold']
  steps_exclude: ['cancel_hold_draft']
  contains_all: ['BK-0028', '26 người lớn']
  not_contains: ['đã kín', 'không còn trống']
fake_turns:
  - tool_calls:
      - name: check_availability
        input: { checkIn: '2027-12-08', checkOut: '2027-12-09', adults: 26, propertyCode: EVANI }
  - tool_calls:
      - name: prepare_hold
        input:
          {
            propertyCode: EVANI,
            checkIn: '2027-12-08',
            checkOut: '2027-12-09',
            adults: 26,
            guestName: 'Trịnh Quốc Bảo',
            guestPhone: '0904567891',
          }
  - text: ''
