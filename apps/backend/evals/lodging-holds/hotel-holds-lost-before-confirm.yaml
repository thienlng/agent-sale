# The summary was sent, then another booking took A17's nights before the customer answered.
lodging:
  taken_before_confirm: true
  hold_draft:
    code: A17
    checkIn: '2027-01-08'
    checkOut: '2027-01-10'
    adults: 20
    guestName: 'Nguyễn Văn Nam'
    guestPhone: '0901234567'
conversation:
  - customer: 'Giữ A17 ngày 8/1/2027 đến 10/1/2027 cho 20 người lớn nhé. Nguyễn Văn Nam, 0901234567'
  - bot: "Giữ chỗ A17 – Sky Villa A17\n08/01 (T6) → 10/01 (CN) · 2 đêm\n20 người lớn\nTổng: 27.000.000đ\nTên: Nguyễn Văn Nam · SĐT: 0901234567\nGiữ trong 2 giờ, nhân viên sẽ gọi xác nhận."
  - customer: '✅ Giữ chỗ'
expect:
  outcome: answered
  guardrail: none
  # confirm_hold fails (not_available): the bot apologises and offers the alternative, no code.
  steps_include: ['confirm_hold']
  steps_not_succeeded: ['confirm_hold']
  order_created: false
  contains_all: ['B05']
  contains_any: ['xin lỗi', 'tiếc']
  not_contains: ['BK-', 'đã giữ chỗ', 'đã đặt']
fake_turns:
  - tool_calls: [{ name: confirm_hold, input: {} }]
  - text: 'Dạ em xin lỗi, A17 vừa có khách khác đặt những ngày này nên em chưa giữ được ạ.\nBên em còn B05 – Garden Villa B05 trống từ 08/01 đến 10/01, tổng 2 đêm 21.000.000đ ạ. Anh Nam có muốn giữ B05 không ạ?'
