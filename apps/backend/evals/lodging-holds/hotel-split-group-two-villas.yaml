# VL3-4 / VL3-5: a group split over two villas is checked per villa with its own party; the total
# is the sum of those two quotes, never the whole group in each villa.
conversation:
  - customer: "We are 40 adults. Split us: 24 people in E64 and 16 in D33, from 17 to 19 December 2027. What's the total?"
expect:
  outcome: answered
  guardrail: none
  steps_succeeded: ['check_availability', 'calculate']
  steps_exclude: ['handoff']
  contains_any: ['48,000,000', '48.000.000']
fake_turns:
  - tool_calls:
      - name: check_availability
        input: { checkIn: '2027-12-17', checkOut: '2027-12-19', adults: 24, propertyCode: E64 }
      - name: check_availability
        input: { checkIn: '2027-12-17', checkOut: '2027-12-19', adults: 16, propertyCode: D33 }
  - tool_calls: [{ name: calculate, input: { expression: '27000000 + 21000000' } }]
  - text: 'E64 for 24 adults is 27.000.000đ and D33 for 16 adults is 21.000.000đ for the 2 nights, 48.000.000đ in total.'
