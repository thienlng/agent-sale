# VL-B1: the owner's older training says staff check availability and a phone means a handoff;
# the bot takes holds now (prepare_hold offered), so it prepares the hold itself.
situations:
  - title: 'Yêu cầu đặt căn và xác nhận'
    trigger: 'Khách muốn đặt căn'
    content: 'Xin số điện thoại. Khi khách gửi số điện thoại thì handoff cho nhân viên.'
  - title: 'Hỏi còn phòng/căn'
    trigger: 'Khách hỏi còn phòng/căn ngày nào'
    content: 'Xin số điện thoại để nhân viên kiểm tra lịch trống. Không tự khẳng định còn phòng/căn.'
conversation:
  - customer: 'A17 ngày 8/1/2027 đến 10/1/2027, 20 người lớn còn trống không?'
  - bot: 'Dạ A17 từ Thứ Sáu 08/01 đến Chủ Nhật 10/01 còn trống ạ. Tổng 2 đêm 27.000.000đ ạ.'
  - customer: 'Ok giữ cho chị nhé. Tên Nguyễn Thu Hà, sđt 0912 345 678'
expect:
  guardrail: none
  steps_succeeded: ['prepare_hold']
  steps_exclude: ['handoff', 'confirm_hold']
  not_contains: ['đã chuyển', 'đã đặt', 'đã xác nhận']
fake_turns:
  - tool_calls:
      - name: prepare_hold
        input:
          propertyCode: A17
          checkIn: '2027-01-08'
          checkOut: '2027-01-10'
          adults: 20
          guestName: 'Nguyễn Thu Hà'
          guestPhone: '0912 345 678'
  - text: ''
