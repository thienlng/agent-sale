      code: A17
      bedrooms: 8
      standardAdults: 24
      standardChildren: 8
      childAgeBelow: 6
      maxGuests: 40
      roomLayout:
        - { name: 'Phòng 1', beds: '2 giường đôi' }
        - { name: 'Phòng 2', beds: '2 giường đôi' }
