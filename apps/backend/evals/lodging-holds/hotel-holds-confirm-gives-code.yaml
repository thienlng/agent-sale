  - customer: 'Giữ A17 ngày 8/1/2027 đến 10/1/2027 cho 20 người lớn nhé. Nguyễn Văn Nam, 0901234567'
  - bot: "Giữ chỗ A17 – Sky Villa A17\n08/01 (T6) → 10/01 (CN) · 2 đêm\n20 người lớn\nTổng: 27.000.000đ\nTên: Nguyễn Văn Nam · SĐT: 0901234567\nGiữ trong 2 giờ, nhân viên sẽ gọi xác nhận."
  - customer: '✅ Giữ chỗ'
expect:
  outcome: answered
  guardrail: none
  # Hold flow, part 2: the hold is placed and its code reaches the customer exactly once.
  steps_succeeded: ['confirm_hold']
  steps_exclude: ['prepare_hold', 'handoff']
  order_created: true
  contains_all: ['BK-0001', 'giữ chỗ']
  max_occurrences: { 'BK-0001': 1 }
  not_contains: ['đã đặt', 'đã xác nhận']
fake_turns:
  - tool_calls: [{ name: confirm_hold, input: {} }]
  - text: ''
