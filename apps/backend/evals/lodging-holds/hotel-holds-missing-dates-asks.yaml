conversation:
  - customer: 'A17 còn phòng không bạn, giá sao?'
expect:
  outcome: answered
  guardrail: none
  # No dates: the bot asks for check-in / check-out (and the party) instead of guessing.
  # PO decision DEC-7: an attempt the tool refuses for the missing dates is harmless.
  steps_exclude: ['prepare_hold', 'handoff']
  steps_not_succeeded: ['check_availability']
  contains_any: ['ngày nhận', 'ngày trả', 'ngày nào', 'ngày đi', 'nhận phòng', 'check-in']
  not_contains: ['đã kín', 'hết phòng', 'đã giữ', 'đã đặt']
fake_turns:
  - text: 'Dạ A17 giá theo đêm: Thứ Hai đến Thứ Năm 12.000.000đ, Thứ Sáu và Chủ Nhật 13.000.000đ, Thứ Bảy 14.000.000đ ạ.\nAnh/chị cho em xin ngày nhận, ngày trả phòng và số khách để em kiểm tra lịch ạ.'
