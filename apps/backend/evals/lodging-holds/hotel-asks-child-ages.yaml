# VL-B3: children without ages: ask the ages; a check with invented ages is refused by the tool.
conversation:
  - customer: 'nhà chị 20 người lớn với 4 bé, A17 từ 8/1/2027 đến 10/1/2027 còn trống không em'
expect:
  outcome: answered
  guardrail: none
  steps_not_succeeded: ['check_availability']
  steps_exclude: ['handoff', 'prepare_hold']
  contains_all: ['tuổi']
fake_turns:
  - tool_calls:
      - name: check_availability
        input:
          {
            checkIn: '2027-01-08',
            checkOut: '2027-01-10',
            adults: 20,
            childAges: [0, 0, 0, 0],
            propertyCode: 'A17',
          }
  - text: 'Dạ chị cho em xin tuổi của từng bé để em kiểm tra A17 chính xác nhé ạ.'
