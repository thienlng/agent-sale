conversation:
  - customer: 'A17 ngày 8/1/2027 đến 10/1/2027, 20 người lớn còn trống không, giá bao nhiêu?'
expect:
  outcome: answered
  guardrail: none
  # Free dates: the bot checks the calendar and quotes the server's nightly prices and total.
  steps_succeeded: ['check_availability']
  steps_exclude: ['prepare_hold', 'handoff']
  contains_all: ['27.000.000']
  contains_any: ['còn trống', 'trống']
  not_contains: ['đã giữ', 'đã đặt', 'đã xác nhận']
fake_turns:
  - tool_calls:
      - name: check_availability
        input: { checkIn: '2027-01-08', checkOut: '2027-01-10', adults: 20, propertyCode: A17 }
  - text: 'Dạ A17 từ Thứ Sáu 08/01 đến Chủ Nhật 10/01 còn trống ạ.\nĐêm Thứ Sáu 13.000.000đ, đêm Thứ Bảy 14.000.000đ, tổng 2 đêm 27.000.000đ ạ.'
