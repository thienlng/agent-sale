situations:
  - title: 'Yêu cầu đặt căn và xác nhận'
    trigger: 'Khách đồng ý thuê, để lại liên hệ hoặc yêu cầu chốt booking'
    content: 'Tóm tắt những thông tin đã biết, xin liên hệ nếu chưa có. Khi khách gửi số điện thoại thì handoff cho nhân viên.'
  - title: 'Kiểm tra tiêu chuẩn đoàn và tuổi trẻ'
    trigger: 'Khách hỏi đoàn đông, thêm người, trẻ em hoặc tuổi trẻ'
    content: 'Không tự hứa miễn phí hay phụ thu. Đoàn vượt hoặc thiếu tuổi cần chủ căn duyệt.'
lodging:
  holds_before:
    - {
        hold: BK-0016,
        code: E64,
        checkIn: '2028-01-14',
        checkOut: '2028-01-16',
        adults: 9,
        childAges: [4, 4, 9],
        guestPhone: '0987654321',
        totalSell: 27000000,
      }
# VL2-4: a date change of a held property prepares the new hold, which replaces the old one: the
# summary names the old code, no second hold is kept and no staff is needed.
conversation:
  - customer: 'giữ E64 tối thứ 6 14/1/2028 đến chủ nhật 16/1/2028, 9 người lớn, 2 bé 4 tuổi và 1 bé 9 tuổi. Tên Lê Minh Quân 0987654321'
  - bot: 'Dạ em đã giữ chỗ BK-0016 đến 03:47 ngày 13/11 ạ. Nhân viên sẽ gọi xác nhận sớm ạ.'
  - customer: 'à anh đổi sang tối thứ 6 21/1/2028 đến chủ nhật 23/1/2028 được không em, vẫn đoàn đó'
expect:
  guardrail: none
  outcome_not: handoff
  steps_succeeded: ['prepare_hold']
  steps_exclude: ['confirm_hold']
  contains_all: ['BK-0016', 'Thay cho']
  quick_replies: ['✅ Giữ chỗ', '✏️ Sửa thông tin']
fake_turns:
  - tool_calls:
      - name: check_availability
        input:
          {
            checkIn: '2028-01-21',
            checkOut: '2028-01-23',
            adults: 9,
            childAges: [4, 4, 9],
            propertyCode: E64,
          }
  - tool_calls:
      - name: prepare_hold
        input:
          {
            propertyCode: E64,
            checkIn: '2028-01-21',
            checkOut: '2028-01-23',
            adults: 9,
            childAges: [4, 4, 9],
            guestName: 'Lê Minh Quân',
            guestPhone: '0987654321',
          }
  - text: ''
