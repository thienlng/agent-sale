        - { name: 'Phòng 1', beds: '2 giường đôi' }
        - { name: 'Phòng 2', beds: '2 giường đôi' }
        - { name: 'Phòng 3', beds: '2 giường đôi' }
        - { name: 'Phòng 4', beds: '2 giường đôi' }
        - { name: 'Phòng 5', beds: '2 giường đôi' }
        - { name: 'Phòng 6', beds: '2 giường đôi' }
        - { name: 'Phòng 7', beds: '2 giường đôi' }
