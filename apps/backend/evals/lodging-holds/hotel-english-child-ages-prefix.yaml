# VL2-2: ages written after "aged" (and "and" before the last one) are the customer's own.
conversation:
  - customer: 'Hello! We are 10 adults and 3 kids aged 1, 4 and 7. Is E64 free from December 17 to December 19, 2027?'
expect:
  outcome: answered
  guardrail: none
  steps_succeeded: ['check_availability']
  steps_exclude: ['handoff']
  contains_any: ['27,000,000', '27.000.000']
  not_contains: ['Dạ', 'ages of', 'how old']
fake_turns:
  - tool_calls:
      - name: check_availability
        input:
          {
            checkIn: '2027-12-17',
            checkOut: '2027-12-19',
            adults: 10,
            childAges: [1, 4, 7],
            propertyCode: E64,
          }
  - text: 'E64 is free from Friday 17/12 to Sunday 19/12/2027 for 10 adults and 3 children (1, 4 and 7). The total for the 2 nights is 27.000.000đ.'
