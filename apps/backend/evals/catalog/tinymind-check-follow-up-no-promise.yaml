id: tinymind-check-follow-up-no-promise
group: catalog
tags: [critical]
bot:
  industry: retail
  name: TinyMind
  profile:
    fields:
      displayName: TinyMind
      shipping: 'Giao hàng toàn quốc, ship nội thành 30.000đ.'
    notes: 'Shop bán đồ chơi gỗ Montessori cho bé.'
products:
  - name: 'Thú gỗ xếp thăng bằng — Wooden Animal Balancing Stacker Toy'
    code: TM-001
    description: 'Bộ thú gỗ xếp thăng bằng, phù hợp bé từ 1 tuổi trở lên. Rèn khéo tay và tư duy.'
    variants:
      - { name: 'Mặc định', price: 340000, stock: 12 }
  - name: 'Xương rồng gỗ xếp thăng bằng — Wooden Balancing Cactus Stacking Toy'
    code: TM-002
    description: 'Xương rồng gỗ xếp thăng bằng, phù hợp bé từ 2 tuổi trở lên.'
    variants:
      - { name: 'Mặc định', price: 460000, stock: 6 }
  - name: 'Xe kéo gỗ — Wooden Pull Along Car'
    code: TM-006
    description: 'Xe kéo gỗ cho bé tập đi, từ 1 tuổi.'
    variants:
      - { name: 'Mặc định', price: 220000, stock: 15 }
conversation:
  - customer: 'Shop ơi bộ xương rồng gỗ xếp thăng bằng bé 2 tuổi chơi được không, còn hàng không?'
  # An earlier reply (old prompt) promised to look it up later; this turn must answer, not promise again.
  - bot: 'Dạ để em kiểm tra lại rồi báo anh/chị ngay ạ.'
  - customer: 'ktra xong chưa shop'
expect:
  outcome: answered
  guardrail: none
  no_greeting: true
  not_matches: ['kiểm tra (lại|xem)', 'để em (xem|kiểm tra)']
  # A product fact from the catalog: the age the cactus suits.
  contains_any: ['2 tuổi']
  numbers_only_from_sources: true
fake_turns:
  - tool_calls:
      - { name: 'search_products', input: { query: 'xương rồng gỗ xếp thăng bằng' } }
  - text: "Dạ Xương rồng gỗ xếp thăng bằng phù hợp bé từ 2 tuổi trở lên ạ.\nMẫu này hiện còn hàng, giá 460.000đ ạ."
