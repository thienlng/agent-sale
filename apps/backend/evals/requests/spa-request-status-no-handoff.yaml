# MS3-1: "lịch của chị xác nhận chưa" after the request was recorded: answered from the
# conversation (recorded, staff will call to confirm), never "đã xác nhận", never a handoff.
requests_before: [appointment]
conversation:
  - customer: 'đặt lịch gội đầu dưỡng sinh thứ Bảy 13/11/2027 lúc 3h chiều ở cơ sở Quận 3 nhé, Ngọc 0977 333 444'
  - bot: 'Dạ yêu cầu đặt lịch gội đầu dưỡng sinh lúc 15h Thứ Bảy 13/11/2027 tại cơ sở Quận 3 đã được ghi nhận ạ. Nhân viên sẽ liên hệ xác nhận lịch ạ.'
  - customer: 'lịch của chị xác nhận chưa em'
expect:
  outcome: answered
  guardrail: none
  steps_exclude: ['handoff']
  not_matches:
    ['(?<!chưa )(?<!sẽ )(?<!để )xác nhận rồi', '(?<!chưa )(?<!sẽ )(?<!để )đã (được )?xác nhận']
fake_turns:
  - text: 'Dạ lịch của chị đã được ghi nhận, nhân viên sẽ gọi chị để xác nhận lịch ạ.'
