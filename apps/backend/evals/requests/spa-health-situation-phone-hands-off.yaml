conversation:
  - customer: 'Chị đang mang thai 4 tháng, phun môi được không em?'
  - bot: "Dạ trường hợp đang mang thai cần chuyên viên tư vấn trực tiếp ạ.\nChị cho em xin họ tên và số điện thoại để chuyên viên liên hệ nhé."
