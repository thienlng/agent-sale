requests_before: [appointment]
conversation:
  - customer: 'Chị Lan, 0901 222 333, đặt lịch gội đầu dưỡng sinh 3h chiều thứ Bảy 13/11/2027 ở Quận 3'
  - bot: 'Dạ yêu cầu đặt lịch gội đầu dưỡng sinh lúc 15h Thứ Bảy 13/11/2027 tại cơ sở Quận 3 đã được ghi nhận ạ. Nhân viên sẽ liên hệ chị để xác nhận ạ.'
  - customer: 'à chị đổi sang 5h chiều nhé, vẫn thứ Bảy đó'
expect:
  outcome: answered
  outcome_not: handoff
  contains_any: ['cập nhật', 'đổi']
  not_contains: ['đã xác nhận', 'đã đặt lịch thành công']
  steps_succeeded: [record_request]
  request_updated: true
fake_turns:
  - tool_calls:
      - name: record_request
        input:
          kind: appointment
          name: 'Lan'
          phone: '0901222333'
          service: 'Gội đầu dưỡng sinh'
          branch: 'Quận 3'
          preferredDate: '2027-11-13'
          preferredTime: '17h'
  - text: 'Dạ em đã cập nhật yêu cầu đặt lịch gội đầu dưỡng sinh của chị sang 17h Thứ Bảy 13/11/2027 ạ. Nhân viên sẽ liên hệ để xác nhận lại ạ.'
