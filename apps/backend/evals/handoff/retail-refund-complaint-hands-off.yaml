id: retail-refund-complaint-hands-off
group: handoff
tags: [critical]
bot:
  industry: retail
  name: TinyMind
  profile:
    fields:
      displayName: TinyMind
      address: '12 Lê Lợi, Quận 1, TP.HCM'
      hotline: '0900 000 000'
      hours: '8h00 - 21h00 mỗi ngày'
      payment: 'Thanh toán khi nhận hàng (COD), chuyển khoản ngân hàng và ví MoMo. Đơn COD được kiểm tra giày trước khi thanh toán.'
      shipping: 'Giao hàng toàn quốc. Phí ship nội thành 30.000đ, miễn phí cho đơn từ 500.000đ; giao nội thành 1-2 ngày, các tỉnh 3-5 ngày.'
      returns: 'Hàng lỗi gửi email support@tinymind.test trong 30 ngày kèm ảnh; đổi trả trong 7 ngày kể từ khi nhận hàng, sản phẩm còn nguyên tem mác và chưa qua sử dụng, miễn phí đổi size lần đầu'
      warranty: 'Giày được bảo hành 6 tháng cho lỗi do nhà sản xuất như bong keo, đứt chỉ. Không áp dụng cho hao mòn do sử dụng hoặc hỏng do khách.'
      promotion: ''
    notes: 'Khách có thể đến cửa hàng thử giày trực tiếp.'
products:
  - name: 'Giày chạy bộ Aero'
    code: AERO
    description: 'Giày chạy bộ nhẹ, đế êm'
    variants:
      - { name: 'Size 41', price: 690000, stock: 5 }
      - { name: 'Size 42', price: 690000, stock: 3 }
  - name: 'Giày thể thao Classic'
    code: CLASSIC
    description: 'Giày thể thao phối đồ hằng ngày'
    variants:
      - { name: 'Size 40', price: 590000, stock: 8 }
# TM3-4 / DEC-2: a broken item and a refund request go to staff with an apology; the policy's
# support email is no reason to refuse the hand-over.
conversation:
  - customer: 'Shop ơi hôm qua em đặt giày Aero, hôm nay nhận hàng thì đế bị nứt'
  - bot: 'Dạ em xin lỗi vì giày bị nứt khi nhận hàng ạ.'
  - customer: 'Em rất bực, mới mua mà đã hỏng. Em muốn hoàn tiền ngay'
expect:
  outcome: handoff
  guardrail: none
  steps_succeeded: ['handoff']
  contains_any: ['xin lỗi']
  not_contains: ['support@']
fake_turns:
  - text: 'Dạ em xin lỗi vì sản phẩm mới nhận đã bị hỏng ạ.'
    tool_calls:
      [{ name: handoff, input: { reason: 'broken shoe on delivery, customer wants a refund' } }]
