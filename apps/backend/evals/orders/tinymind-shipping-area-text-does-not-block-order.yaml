id: tinymind-shipping-area-text-does-not-block-order
group: orders
tags: [critical]
bot:
  industry: retail
  name: TinyMind
  orderTaking: true
  orderShippingFeeVnd: 30000
  profile:
    fields:
      {
        displayName: TinyMind,
        shipping: 'Chỉ giao trong 50 bang Hoa Kỳ. Phí giao tiêu chuẩn 8.99 USD.',
      }
    notes: 'Shop bán đồ chơi gỗ Montessori cho bé.'
products:
  - name: 'Thú gỗ xếp thăng bằng'
    code: TM-001
    description: 'Bộ thú gỗ xếp thăng bằng, phù hợp bé từ 1 tuổi trở lên.'
    variants:
      - { name: 'Mặc định', sku: TM-001-STD, price: 340000, stock: 12 }
# TM3-1: a shipping-area line in the profile (a seeded US text) never refuses a Vietnamese
# order: the bot prepares it; staff confirm the shipping.
conversation:
  - customer: 'Thú gỗ xếp thăng bằng còn không shop'
  - bot: 'Dạ Thú gỗ xếp thăng bằng còn hàng, giá 340.000đ ạ.'
  - customer: 'bà lấy 2 bộ, giao về Đà Nẵng nhé. Nguyễn Thị Hoa, 0905 123 456, 45 Nguyễn Văn Linh, Hải Châu, Đà Nẵng'
expect:
  guardrail: none
  steps_succeeded: ['prepare_order']
  steps_exclude: ['handoff']
fake_turns:
  - tool_calls:
      - name: prepare_order
        input:
          items: [{ sku: TM-001-STD, qty: 2 }]
          recipient:
            {
              name: 'Nguyễn Thị Hoa',
              phone: '0905 123 456',
              address: '45 Nguyễn Văn Linh, Hải Châu, Đà Nẵng',
            }
  - text: ''
