id: hotel-alternative-package-total-only
group: lodging-packages
tags: [critical]
bot:
  industry: hotel
  name: Test lodging assistant
  profile:
    fields:
      displayName: Test lodging business
    notes: ''
products:
  - name: 'AURA – Aura Villa 6PN'
    code: AURA
    description: 'Villa nguyên căn 6 phòng ngủ, thuê theo gói 4PN, 5PN hoặc 6PN.'
    variants:
      - name: 'Nguyên căn, giá tham khảo'
        price: 10000000
        stock: 0
    accommodation:
      rentalType: entire_property
      code: AURA
      bedrooms: 1
      standardAdults: 12
      standardChildren: 0
      childAgeBelow: 6
      maxGuests: 20
      roomLayout:
        - { name: 'Nguyên căn', beds: 'Beds described by owner' }
      amenities: ['Bể bơi']
      rateBasis: night
      # The full package (6PN) prices.
      rates:
        - { days: [1, 2, 3, 4], amount: 10000000 }
        - { days: [5, 7], amount: 12000000 }
        - { days: [6], amount: 18000000 }
      gallery: []
      # 4PN is not sold on Saturday (weekdaySell index 5).
      packages:
        - name: 4PN
          bedrooms: 4
          standardAdults: 8
          standardChildren: 0
          maxGuests: 10
          weekdaySell: [8000000, 8000000, 8000000, 8000000, 10000000, null, 10000000]
        - name: 5PN
          bedrooms: 5
          standardAdults: 10
          standardChildren: 0
          maxGuests: 12
          weekdaySell: [9000000, 9000000, 9000000, 9000000, 11000000, 16000000, 11000000]
        - name: 6PN
          bedrooms: 6
          standardAdults: 12
          standardChildren: 0
          maxGuests: 16
          weekdaySell: [10000000, 10000000, 10000000, 10000000, 12000000, 18000000, 12000000]
      surcharges: { extraAdult: null, extraChild: null, childFreeBelow: 6, childAdultFrom: 12 }
# VL-B12: the option's nightly prices are the picked package's (5PN); the customer chooses the
# alternative 6PN, quoted by its own total only, never with 5PN's nights.
conversation:
  - customer: 'Aura từ thứ 6 8/1/2027 đến chủ nhật 10/1/2027, 6 người lớn'
  - bot: 'Dạ Aura còn trống, gói 5PN tổng 27.000.000đ cho 2 đêm ạ.'
  - customer: 'anh lấy gói 6PN cho rộng thì tổng bao nhiêu em'
expect:
  outcome: answered
  guardrail: none
  steps_succeeded: ['check_availability']
  contains_all: ['30.000.000']
  not_contains: ['11.000.000', '16.000.000']
fake_turns:
  - tool_calls:
      - name: check_availability
        input: { checkIn: '2027-01-08', checkOut: '2027-01-10', adults: 6, propertyCode: 'AURA' }
  - text: 'Dạ gói 6PN của Aura từ 08/01 đến 10/01/2027 tổng 30.000.000đ cho 2 đêm ạ.'
