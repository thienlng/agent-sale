id: hotel-package-not-sold-that-weekday
group: lodging-packages
tags: [critical]
bot:
  industry: hotel
  name: Test lodging assistant
  profile:
    fields:
      displayName: Test lodging business
    notes: ''
products:
  - name: 'AURA – Aura Villa 6PN'
    code: AURA
    description: 'Villa nguyên căn 6 phòng ngủ, thuê theo gói 4PN, 5PN hoặc 6PN.'
    variants:
      - name: 'Nguyên căn, giá tham khảo'
        price: 10000000
        stock: 0
    accommodation:
      rentalType: entire_property
      code: AURA
      bedrooms: 1
      standardAdults: 12
      standardChildren: 0
      childAgeBelow: 6
      maxGuests: 20
      roomLayout:
        - { name: 'Nguyên căn', beds: 'Beds described by owner' }
      amenities: ['Bể bơi']
      rateBasis: night
      # The full package (6PN) prices.
      rates:
        - { days: [1, 2, 3, 4], amount: 10000000 }
        - { days: [5, 7], amount: 12000000 }
        - { days: [6], amount: 18000000 }
      gallery: []
      # 4PN is not sold on Saturday (weekdaySell index 5).
      packages:
        - name: 4PN
          bedrooms: 4
          standardAdults: 8
          standardChildren: 0
          maxGuests: 10
          weekdaySell: [8000000, 8000000, 8000000, 8000000, 10000000, null, 10000000]
        - name: 5PN
          bedrooms: 5
          standardAdults: 10
          standardChildren: 0
          maxGuests: 12
          weekdaySell: [9000000, 9000000, 9000000, 9000000, 11000000, 16000000, 11000000]
        - name: 6PN
          bedrooms: 6
          standardAdults: 12
          standardChildren: 0
          maxGuests: 16
          weekdaySell: [10000000, 10000000, 10000000, 10000000, 12000000, 18000000, 12000000]
      surcharges: { extraAdult: null, extraChild: null, childFreeBelow: 6, childAdultFrom: 12 }
# VL-B11: without dates, a package is quoted for the weekday asked only when it is sold that day:
# 4PN is not sold on Saturday (notSoldOn), so no Friday/Sunday price is given for Saturday.
conversation:
  - customer: 'Aura gói 4PN tối thứ 7 giá bao nhiêu em, nhà anh 7 người lớn'
expect:
  outcome: answered
  guardrail: none
  steps_exclude: ['handoff', 'prepare_hold']
  contains_any: ['không bán', 'không áp dụng', 'không có gói 4PN']
  not_contains: ['10.000.000', '8.000.000']
fake_turns:
  - tool_calls:
      - { name: search_products, input: { query: 'Aura' } }
  - text: 'Dạ gói 4PN của Aura không bán tối Thứ Bảy ạ. Tối Thứ Bảy anh có thể chọn gói 5PN giá 16.000.000đ ạ.'
