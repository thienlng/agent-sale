id: hotel-aura-package-autopick
group: lodging-packages
tags: [critical]
bot:
  industry: hotel
  name: Test lodging assistant
  profile:
    fields:
      displayName: Test lodging business
    notes: ''
products:
  - name: 'AURA – Aura Villa 6PN'
    code: AURA
    description: 'Villa nguyên căn 6 phòng ngủ, thuê theo gói 4PN, 5PN hoặc 6PN.'
    variants:
      - name: 'Nguyên căn, giá tham khảo'
        price: 10000000
        stock: 0
    accommodation:
      rentalType: entire_property
      code: AURA
      bedrooms: 1
      standardAdults: 12
      standardChildren: 0
      childAgeBelow: 6
      maxGuests: 20
      roomLayout:
        - { name: 'Nguyên căn', beds: 'Beds described by owner' }
      amenities: ['Bể bơi']
      rateBasis: night
      # The full package (6PN) prices.
      rates:
        - { days: [1, 2, 3, 4], amount: 10000000 }
        - { days: [5, 7], amount: 12000000 }
        - { days: [6], amount: 18000000 }
      gallery: []
      # 4PN is not sold on Saturday (weekdaySell index 5).
      packages:
        - name: 4PN
          bedrooms: 4
          standardAdults: 8
          standardChildren: 0
          maxGuests: 10
          weekdaySell: [8000000, 8000000, 8000000, 8000000, 10000000, null, 10000000]
        - name: 5PN
          bedrooms: 5
          standardAdults: 10
          standardChildren: 0
          maxGuests: 12
          weekdaySell: [9000000, 9000000, 9000000, 9000000, 11000000, 16000000, 11000000]
        - name: 6PN
          bedrooms: 6
          standardAdults: 12
          standardChildren: 0
          maxGuests: 16
          weekdaySell: [10000000, 10000000, 10000000, 10000000, 12000000, 18000000, 12000000]
      surcharges: { extraAdult: null, extraChild: null, childFreeBelow: 6, childAdultFrom: 12 }
conversation:
  - customer: 'Aura tối thứ 7 09/01 nhà mình 6 người lớn, ở 1 đêm, giá bao nhiêu ạ?'
# 6 guests fit 4PN, but 4PN is not sold on Saturday: the calendar picks 5PN. The bot quotes 5PN
# with the server's total, never a 4PN price or offer (saying 4PN is not sold that night is fine).
expect:
  outcome: answered
  guardrail: none
  steps_succeeded: [check_availability]
  steps_exclude: [prepare_hold, handoff]
  contains_all: ['5PN', '16.000.000']
  not_contains: ['10.000.000']
  # Saying 4PN is not sold that night is fine (PO); quoting a 4PN price or offering 4PN is not.
  # EV-10: exactly the 4PN figure; the 6PN alternative's 18.000.000 is not it.
  not_matches:
    - "(?<![\\d.,])8[.,]000[.,]000(?![.,]?\\d)"
    - "4PN(?:(?!\\dPN)[^.!?;\\n]){0,40}?(\\d{1,3}([.,]\\d{3}){1,2}|\\d+([.,]\\d+)?\\s*(tr|triệu|k)(?![\\p{L}]))"
    - "4PN(?:(?!không|chưa|ko\\b|\\dPN)[^.!?;\\n]){0,30}(còn trống|còn phòng|vẫn còn|phù hợp|xếp được|đặt được|giữ được|được ạ)"
fake_turns:
  - tool_calls:
      - name: check_availability
        input: { checkIn: '2027-01-09', checkOut: '2027-01-10', adults: 6, propertyCode: 'AURA' }
  - text: 'Dạ Aura đêm Thứ Bảy 09/01 còn trống ạ. Cho 6 người lớn bên em xếp gói 5PN, tổng 16.000.000đ cho 1 đêm ạ.'
