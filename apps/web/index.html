<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f26b1d" />
    <meta
      name="description"
      content="Rapiz — bot bán hàng AI cho cửa hàng và doanh nghiệp Việt Nam."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Rapiz</title>
    <style>
      /* Static splash painted before the app's JavaScript arrives (replaced on first render). */
      .boot {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        background: #fff;
      }
      .boot img {
        width: 56px;
        height: 56px;
        animation: boot 1.2s ease-in-out infinite;
      }
      @keyframes boot {
        50% {
          opacity: 0.45;
        }
      }
      /* .dark is set by the preferences boot script injected first in <head>. */
      .dark .boot {
        background: #17130f;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <img src="/logo.png" alt="" width="56" height="56" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
