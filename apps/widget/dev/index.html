<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget dev host</title>
  </head>
  <body>
    <h1>Widget dev host</h1>
    <p>Edit the <code>key</code> and <code>data-api</code> below, then reload.</p>
    <!-- data-api: origin of a local API; the script itself is served from dist/ -->
    <script
      src="../dist/widget.js?key=REPLACE_WITH_SITE_KEY"
      data-api="http://localhost:3000"
    ></script>
  </body>
</html>
