name: Task / feature request
description: Propose work. Accepted items become a T-xxx task in TODO.md.
labels: [task]
body:
  - type: input
    id: title
    attributes:
      label: Imperative title
      placeholder: Add CSV import for contacts
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and goal
      description: Why this matters; link the docs section or feature ID (e.g. CRM-11).
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      placeholder: '- [ ] …'
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
