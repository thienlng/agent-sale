name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing by default; each job asks for what it reads. Actions are pinned to a
# commit SHA (the comment names the release; Dependabot keeps both current).
permissions: {}

# Three jobs: the gate (check), browser tests against a real API (e2e), and Testcontainers
# integration tests. Everything else is a step inside them.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # PR title check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            perf
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: Subject must start with a lowercase letter.

      # Scan the full history with the pinned gitleaks CLI (no license, no dependency on the push range).
      # The checksum is the release's gitleaks_<version>_checksums.txt entry; change both together.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code=1 --no-banner .

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Commit messages (PR only; Dependabot exempt)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Fails above the web bundle budget (docs/16 §1).
      - name: Build
        run: pnpm build

      - name: hermes-runtime unit tests
        run: python -I -m unittest discover -s services/hermes -p 'test_*.py'

      # Server side of the deploy: the deploy key's forced command and the edge security headers
      # (docs/runbooks/deploy-vps.md, docs/09-security-and-compliance.md §6).
      - name: Deploy scripts and edge headers
        run: |
          bash infra/deploy/test/deploy-ssh-test.sh
          bash infra/deploy/test/edge-headers.sh

  e2e:
    name: e2e (web + site)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rapiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI database credentials, not secrets.
      DATABASE_OWNER_URL: postgres://postgres:postgres@localhost:5432/rapiz
      DATABASE_URL: postgres://rapiz_tenant:rapiz_tenant_ci@localhost:5432/rapiz
      DATABASE_SYSTEM_URL: postgres://rapiz_system:rapiz_system_ci@localhost:5432/rapiz
      NODE_ENV: development
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build backend, web and site
        run: pnpm turbo build --filter=@agent-sales/backend --filter=@agent-sales/web --filter=@agent-sales/site
      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Web smoke tests (API mocked)
        run: pnpm test:e2e
        working-directory: apps/web
      # Accessibility and best practices block the PR; performance warns (CI hardware varies).
      - name: Lighthouse CI on /login
        run: pnpm dlx @lhci/cli@0.15.1 autorun
        working-directory: apps/web
      - name: Migrate (with login roles)
        run: pnpm --filter @agent-sales/db exec tsx src/cli/migrate.ts --dev-roles
      - name: Web live-backend tests (real API and Postgres)
        run: pnpm test:e2e:live
        working-directory: apps/web
      # Links into the app, demo, theme, reduced motion, layout widths and self-hosted fonts.
      - name: Site browser checks
        run: pnpm test:e2e
        working-directory: apps/site

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers, real Postgres)
        run: pnpm test:integration
