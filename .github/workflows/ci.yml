name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit messages (PR only; Dependabot exempt)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  web:
    name: web (e2e smoke + Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      # Builds the web app and its workspace dependencies; fails above the bundle budget (docs/16 §1).
      - name: Build
        run: pnpm turbo build --filter=@agent-sales/web
        working-directory: .
      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests (API mocked)
        run: pnpm test:e2e
      # Accessibility and best practices block the PR; performance warns (CI hardware varies).
      - name: Lighthouse CI on /login
        run: pnpm dlx @lhci/cli@0.15.1 autorun

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers, real Postgres)
        run: pnpm test:integration

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scan the full history with the pinned gitleaks CLI (no license, no dependency on the push range).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code=1 --no-banner .
