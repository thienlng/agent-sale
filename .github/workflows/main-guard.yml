name: Main guard

# Compensating control while GitHub branch protection is unavailable on this
# plan: every commit that lands on main must come from a merged pull request.
# A direct push makes this workflow fail loudly so it is visible and reverted.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-only:
    name: commits on main come from merged PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check head commit is associated with a merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          merged=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged" -eq 0 ]; then
            echo "::error::Commit ${SHA} was pushed directly to main without a merged pull request. Revert it and open a PR (.agents/rules/02-git-and-pr.md)."
            exit 1
          fi
          echo "OK: ${SHA} comes from a merged pull request."
