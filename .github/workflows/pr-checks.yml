name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read
  contents: read

jobs:
  conventions:
    name: conventions
    # Dependabot PRs follow their own branch/commit format and are reviewed via .github/dependabot.yml.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            perf
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: Subject must start with a lowercase letter.

      - name: Branch name and task reference
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BRANCH" | grep -Eq '^(feat|fix|refactor|chore|docs|test|perf|ci|build|revert)/T-[0-9]{3,}[a-z]?-[a-z0-9-]+$'; then
            echo "::error::Branch '$BRANCH' must match <type>/T-<id>-<slug> (see .agents/rules/02-git-and-pr.md)"; exit 1
          fi
          if ! printf '%s\n%s' "$TITLE" "$BODY" | grep -Eq 'T-[0-9]{3,}[a-z]?'; then
            echo "::error::PR title or body must reference a task ID (T-xxx)"; exit 1
          fi
          if ! printf '%s' "$BODY" | grep -q '## Verification'; then
            echo "::error::PR body must use .github/PULL_REQUEST_TEMPLATE.md (missing '## Verification')"; exit 1
          fi

      - name: PR size (warning)
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          total=$((ADDITIONS + DELETIONS))
          if [ "$total" -gt 5000 ]; then
            echo "::warning::PR changes $total lines. Large PRs are fine (rule 02) but make sure the body has one section per task and a start-reading pointer."
          fi
