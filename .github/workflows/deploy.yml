name: Deploy

# Every green CI run on main ships to the server: build both images, push them to GHCR
# tagged with the commit SHA, then run infra/deploy/deploy.sh over SSH (pull, migrate,
# restart, automatic rollback when the health check fails). Runbook: docs/runbooks/deploy-vps.md.
# Manual run (Actions -> Deploy -> Run workflow) redeploys the chosen ref.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Off until the maintainer sets the repository variable DEPLOY_ENABLED=true (runbook step 4).
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deploy/Dockerfile
          target: app
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}/app:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}/app:latest
          cache-from: type=gha,scope=rapiz
          cache-to: type=gha,mode=max,scope=rapiz
      - name: Build and push edge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deploy/Dockerfile
          target: edge
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/edge:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}/edge:latest
          cache-from: type=gha,scope=rapiz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.PUBLIC_HOST }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Sync server files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp -q infra/deploy/compose.yml infra/deploy/deploy.sh infra/deploy/backup.sh \
            infra/deploy/set-host.sh "$TARGET:/opt/rapiz/"
      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # The job token can pull the private images until this job ends; log out right after.
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u $GHCR_USER --password-stdin >/dev/null"
          ssh "$TARGET" "cd /opt/rapiz && RAPIZ_IMAGE=$IMAGE ./deploy.sh $TAG; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
