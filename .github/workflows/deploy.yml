name: Deploy

# Every green CI run on main ships to the server: build both images, push them to GHCR
# tagged with the commit SHA, then run infra/deploy/deploy.sh over SSH (pull, migrate,
# restart, automatic rollback when the health check fails). Runbook: docs/runbooks/deploy-vps.md.
# Manual run (Actions -> Deploy -> Run workflow) redeploys main only; other refs are refused.
# The deploy key is an environment secret of `production` (main only, required reviewer) and the
# server forces it to run infra/deploy/deploy-ssh.sh, which accepts only `deploy <commit sha>` or
# `rollback` and takes the server files from the image of that commit (runbook "Deploy key").

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    # Off until the maintainer sets the repository variable DEPLOY_ENABLED=true (runbook step 4).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Only main deploys
        env:
          REF: ${{ github.ref }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $REF != refs/heads/main ]] ||
             [[ $GITHUB_EVENT_NAME == workflow_run && $RUN_BRANCH != main ]]; then
            echo "::error::only main deploys" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: meta
        run: |
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/deploy/Dockerfile
          target: app
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          # Commit tags only (no mutable :latest): the server deploys exactly the reviewed commit.
          tags: ${{ steps.meta.outputs.image }}/app:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=rapiz
          cache-to: type=gha,mode=max,scope=rapiz
      - name: Build and push edge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/deploy/Dockerfile
          target: edge
          push: true
          tags: ${{ steps.meta.outputs.image }}/edge:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=rapiz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.PUBLIC_HOST }}
    permissions:
      packages: read # the job token lets the server pull the private images
    steps:
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # One request the forced command understands; the registry login travels on stdin and the
          # server logs out when it ends. The script path also works before the key is restricted.
          [[ $TAG =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad tag" >&2; exit 1; }
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" |
            ssh "$TARGET" "/opt/apps/rapiz/deploy-ssh.sh deploy $TAG"
