version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'build(deps)'
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'
  # Base images pinned by digest (Dockerfiles and compose files).
  - package-ecosystem: docker
    directories: [/infra/deploy, /infra/deploy/postgres]
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: 'build(deps)'
  - package-ecosystem: docker-compose
    directories: [/infra/deploy, /infra/docker]
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: 'build(deps)'
