# Production stack on one server (docs/runbooks/deploy-vps.md). Lives in /opt/apps/rapiz next
# to its .env (created by bootstrap.sh). deploy.sh pulls the images for RAPIZ_TAG, runs the
# migrations, then restarts the services. Nothing publishes ports: the server's Nginx Proxy
# Manager terminates HTTPS and reaches `edge` as `rapiz-edge:80` on the external `proxy`
# network. State services sit on the internal `backend` network only.
name: rapiz

x-app: &app
  image: ${RAPIZ_IMAGE:-ghcr.io/thienlng/agent-sale}/app:${RAPIZ_TAG:-latest}
  env_file: .env
  environment:
    NODE_ENV: production
  restart: unless-stopped
  networks: [default, backend]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

# WAL-G settings shared by postgres and the restore container (ADR-028). Empty BACKUP_S3_BUCKET
# = off-site backups off; wal-g-archive then lets Postgres recycle WAL as before.
x-walg-env: &walg-env
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  WALG_S3_PREFIX: s3://${BACKUP_S3_BUCKET:-none}/wal-g
  AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  AWS_REGION: ${BACKUP_S3_REGION:-auto}
  AWS_S3_FORCE_PATH_STYLE: 'true'
  AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
  WALG_LIBSODIUM_KEY: ${BACKUP_WALG_KEY:-}
  WALG_LIBSODIUM_KEY_TRANSFORM: base64
  WALG_COMPRESSION_METHOD: zstd
  PGHOST: /var/run/postgresql
  PGUSER: rapiz_owner
  PGDATABASE: rapiz

services:
  postgres:
    # pgvector + WAL-G, rclone and age (infra/deploy/postgres, ADR-028), built on the server by
    # deploy.sh. Archiving is always on; wal-g-archive is a no-op until BACKUP_S3_BUCKET is set.
    image: rapiz-postgres:local
    build: ./postgres
    restart: unless-stopped
    command:
      [
        'postgres',
        '-c',
        'archive_mode=on',
        '-c',
        'archive_command=/usr/local/bin/wal-g-archive %p',
        '-c',
        'archive_timeout=60',
      ]
    environment:
      <<: *walg-env
      POSTGRES_USER: rapiz_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
      POSTGRES_DB: rapiz
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rapiz_owner -d rapiz']
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256m
    # default: egress to the off-site bucket for WAL archiving (no published port).
    networks: [default, backend]
    logging: *logging

  # Password from REDIS_PASSWORD (bootstrap.sh / deploy.sh generate it; REDIS_URL carries it). It
  # goes into a config file inside the container, never onto a command line.
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        umask 077
        : > /tmp/redis.conf
        if [ -n "$$REDIS_PASSWORD" ]; then printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf; fi
        chown redis /tmp/redis.conf
        exec docker-entrypoint.sh redis-server /tmp/redis.conf --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
    logging: *logging

  # S3-compatible object storage. The identities file is rendered from .env at start:
  # `rapiz` writes, `anonymous` may only read the bucket (public product pictures for Meta).
  # Only the S3 gateway listens on the network: master, volume and filer bind to the container's
  # loopback (`weed shell` runs inside it), and their HTTP APIs also want a JWT signed with
  # SEAWEEDFS_JWT_KEY when it is set. The Iceberg and Lance catalog ports are off.
  object-storage:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_BUCKET: ${S3_BUCKET:-rapiz}
      SEAWEEDFS_JWT_KEY: ${SEAWEEDFS_JWT_KEY:-}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        umask 077
        cat > /tmp/s3.json <<JSON
        {"identities":[
          {"name":"rapiz","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],
           "actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"anonymous","actions":["Read:$$S3_BUCKET"]}]}
        JSON
        mkdir -p /etc/seaweedfs
        {
          printf '[access]\nui = false\n'
          if [ -n "$$SEAWEEDFS_JWT_KEY" ]; then
            for s in jwt.signing jwt.signing.read jwt.filer_signing jwt.filer_signing.read; do
              printf '[%s]\nkey = "%s"\nexpires_after_seconds = 30\n' "$$s" "$$SEAWEEDFS_JWT_KEY"
            done
          fi
        } > /etc/seaweedfs/security.toml
        exec weed server -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3.ip.bind=0.0.0.0 -s3.port.iceberg=0 \
          -s3.port.lance=0 -dir=/data -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 \
          -volume.max=0
    volumes: [s3data:/data]
    networks: [backend]
    logging: *logging

  migrate:
    <<: *app
    restart: 'no'
    profiles: [tools]
    command: ['node', 'packages/db/dist/cli/migrate.js', '--login-roles']

  api:
    <<: *app
    command: ['node', 'apps/backend/dist/entries/api.js']
    environment: { NODE_ENV: production, PORT: '3000' }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agent:
    <<: *app
    command: ['node', 'apps/backend/dist/entries/agent.js']

  worker:
    <<: *app
    command: ['node', 'apps/backend/dist/entries/worker.js']

  webhook:
    <<: *app
    command: ['node', 'apps/webhook/dist/main.js']
    environment: { NODE_ENV: production, PORT: '3001' }
    depends_on:
      postgres: { condition: service_healthy }

  # Optional ChatGPT-plan bridge (testing only): COMPOSE_PROFILES=hermes and HERMES_BRIDGE_KEY in
  # .env, image built on the server (docs/runbooks/deploy-vps.md). Admin → Mô hình AI then adds a
  # Hermes provider at http://hermes:8788. No published port; reachable only by the stack.
  hermes:
    image: rapiz-hermes:local
    pull_policy: never
    profiles: [hermes]
    restart: unless-stopped
    environment:
      HERMES_BRIDGE_KEY: ${HERMES_BRIDGE_KEY:-}
    volumes: [hermes:/data]
    # `default` for egress to OpenAI (sign-in and turns); `backend` is internal-only.
    networks: [default, backend]
    logging: *logging

  # Off-site media and config copies (infra/deploy/postgres/rapiz-backup); run by backup-nightly.sh
  # and restore-drill.sh, and by hand for restores (docs/runbooks/backup-and-restore.md).
  backup:
    image: rapiz-postgres:local
    pull_policy: never
    profiles: [tools]
    env_file: .env
    entrypoint: ['rapiz-backup']
    volumes: ['./.env:/cfg/.env:ro', './compose.yml:/cfg/compose.yml:ro']
    networks: [default, backend]
    logging: *logging

  # Throwaway restore target of restore-drill.sh and of point-in-time restores (runbook).
  pgdrill:
    image: rapiz-postgres:local
    pull_policy: never
    profiles: [tools]
    entrypoint: ['pg-drill-entrypoint']
    environment:
      <<: *walg-env
      DRILL_TARGET_TIME: ${DRILL_TARGET_TIME:-}
      DRILL_BACKUP: ${DRILL_BACKUP:-}
    volumes: [pgdrill:/var/lib/postgresql/data]
    shm_size: 256m
    networks: [default]
    logging: *logging

  edge:
    image: ${RAPIZ_IMAGE:-ghcr.io/thienlng/agent-sale}/edge:${RAPIZ_TAG:-latest}
    restart: unless-stopped
    environment:
      S3_BUCKET: ${S3_BUCKET:-rapiz}
      # Site key of the Website channel shown as a chat bubble on the marketing pages (optional).
      RAPIZ_SITE_WIDGET_KEY: ${RAPIZ_SITE_WIDGET_KEY:-}
    networks:
      default: {}
      backend: {}
      proxy: { aliases: [rapiz-edge] }
    depends_on: [api, webhook, object-storage]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

networks:
  backend:
    internal: true
  proxy:
    external: true

volumes:
  pgdata:
  pgdrill:
  redisdata:
  s3data:
  hermes:
