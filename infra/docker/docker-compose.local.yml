# Local development services (self-hosted stack, ADR-006). Not for production.
# Ports bind to 127.0.0.1 only: the services run with throwaway credentials or none.
# Usage: docker compose -f infra/docker/docker-compose.local.yml up -d
#        pnpm db:migrate
name: rapiz-local

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rapiz
    ports: ['127.0.0.1:5433:5432'] # 5433 avoids clashing with a host Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rapiz']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]

  # Object storage (S3 API). SeaweedFS because MinIO no longer publishes community images
  # (pull access denied, 2026-10). Anonymous identity = public reads (Meta fetches bot pictures),
  # the `rapiz` identity writes. Create the bucket once: see docs/10 section 1.
  object-storage:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    # Small volumes: the 30 GB default reserves more than a laptop disk has free, and then no
    # volume can be created ("Not enough data nodes found") and every upload fails.
    command:
      [
        'server',
        '-s3',
        '-s3.port=9000',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-dir=/data',
        '-master.volumeSizeLimitMB=100',
        '-volume.max=50',
      ]
    ports: ['127.0.0.1:9000:9000']
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

volumes:
  pgdata:
  redisdata:
  s3data:
