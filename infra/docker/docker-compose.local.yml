# Local development services (self-hosted stack, ADR-006). Not for production.
# Usage: docker compose -f infra/docker/docker-compose.local.yml up -d
#        pnpm db:migrate
name: rapiz-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rapiz
    ports: ['5433:5432'] # 5433 avoids clashing with a host Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rapiz']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]

  # Object storage (S3 API). SeaweedFS because MinIO no longer publishes community images
  # (pull access denied, 2026-10). Anonymous identity = public reads (Meta fetches bot pictures),
  # the `rapiz` identity writes. Create the bucket once: see docs/10 section 1.
  object-storage:
    image: chrislusf/seaweedfs:latest
    command: ['server', '-s3', '-s3.port=9000', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    ports: ['9000:9000']
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  redisdata:
  s3data:
